name: Deploy to production

on:
  push:
    branches:
    - development

env:
  IMAGE_NAME: nellcorp/outline
  BASE_IMAGE_NAME: nellcorp/outline-base
  TAG: 0.0.3

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout Current branch
      uses: actions/checkout@v3
    - name: Publish image and deploy
      run: |
        docker login -u="$DOCKER_USERNAME" -p="$DOCKER_PASSWORD"
        docker buildx build -f Dockerfile.base --rm -t ${{ env.BASE_IMAGE_NAME }}:${{ env.TAG }} --platform linux/arm64 --push .
        docker buildx build --rm -t ${{ env.IMAGE_NAME }}:${{ env.TAG }} --platform linux/arm64 --push .
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
